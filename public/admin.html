<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Imaan Fihlani</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Quill Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/index.css" />

  <style>
    /* Admin specific styles */
    .admin-container {
      max-width: 1000px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .admin-header h1 {
      font-family: 'Playfair Display', serif;
      color: #FFFFFF;
      font-size: 2rem;
    }
    .admin-header .btn {
      padding: 0.6rem 1.5rem;
      font-size: 0.8rem;
    }
    .admin-login {
      max-width: 400px;
      margin: 150px auto;
      text-align: center;
    }
    .admin-login h2 {
      color: #FFFFFF;
      margin-bottom: 1.5rem;
    }
    .admin-login .form-field {
      margin-bottom: 1rem;
    }
    .admin-login input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #141414;
      border: 1px solid rgba(201,168,76,0.2);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      border-radius: 4px;
    }
    .admin-login input:focus {
      outline: none;
      border-color: #C9A84C;
    }
    .admin-login .btn {
      width: 100%;
      margin-top: 0.5rem;
    }
    .admin-login .error {
      color: #FF6B6B;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .admin-toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .admin-toolbar .btn {
      padding: 0.6rem 1.5rem;
      font-size: 0.8rem;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: #141414;
      border-radius: 8px;
      overflow: hidden;
    }
    .admin-table th {
      background: #1A1A1A;
      color: #C9A84C;
      padding: 1rem;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .admin-table td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #D0D0D0;
      font-size: 0.9rem;
    }
    .admin-table tr:hover td {
      background: rgba(201,168,76,0.05);
    }
    .admin-table .status-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge.published {
      background: rgba(123,198,126,0.2);
      color: #7BC67E;
    }
    .status-badge.draft {
      background: rgba(255,107,107,0.2);
      color: #FF6B6B;
    }
    .admin-table .actions {
      display: flex;
      gap: 0.5rem;
    }
    .admin-table .actions button {
      background: none;
      border: none;
      color: #B0B0B0;
      cursor: pointer;
      transition: color 0.3s;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
    }
    .admin-table .actions button:hover {
      color: #C9A84C;
    }
    .admin-table .actions button.delete:hover {
      color: #FF6B6B;
    }
    .admin-form {
      background: #141414;
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      border: 1px solid rgba(201,168,76,0.1);
    }
    .admin-form .form-field {
      margin-bottom: 1.2rem;
    }
    .admin-form label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #B0B0B0;
      margin-bottom: 0.3rem;
    }
    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: #0A0A0A;
      border: 1px solid rgba(201,168,76,0.15);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      border-radius: 4px;
      transition: border-color 0.3s;
    }
    .admin-form input:focus,
    .admin-form textarea:focus,
    .admin-form select:focus {
      outline: none;
      border-color: #C9A84C;
    }
    .admin-form .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .admin-form .btn {
      padding: 0.8rem 2rem;
    }
    .admin-form .btn-secondary {
      background: transparent;
      color: #B0B0B0;
      border-color: rgba(255,255,255,0.15);
      margin-left: 0.5rem;
    }
    .admin-form .btn-secondary:hover {
      border-color: #C9A84C;
      color: #C9A84C;
    }
    .admin-form .checkbox-field {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .admin-form .checkbox-field input[type="checkbox"] {
      width: auto;
      width: 20px;
      height: 20px;
      accent-color: #C9A84C;
    }
    .admin-form .checkbox-field label {
      margin-bottom: 0;
      cursor: pointer;
    }
    .admin-empty {
      text-align: center;
      color: #666;
      padding: 3rem 0;
    }
    .admin-loading {
      text-align: center;
      color: #666;
      padding: 2rem 0;
    }
    .admin-success {
      color: #7BC67E;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background: rgba(123,198,126,0.1);
      margin-bottom: 1rem;
    }
    .admin-error {
      color: #FF6B6B;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background: rgba(255,107,107,0.1);
      margin-bottom: 1rem;
    }

    /* Quill Editor styles */
    #editor-container {
      background: #0A0A0A;
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 4px;
      min-height: 300px;
      color: #FFFFFF;
    }
    #editor-container .ql-editor {
      min-height: 300px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.8;
    }
    #editor-container .ql-editor strong {
      font-weight: 700;
      color: #FFFFFF;
    }
    #editor-container .ql-editor em {
      font-style: italic;
    }
    #editor-container .ql-editor u {
      text-decoration: underline;
    }
    #editor-container .ql-editor h1,
    #editor-container .ql-editor h2,
    #editor-container .ql-editor h3 {
      color: #FFFFFF;
      font-family: 'Playfair Display', serif;
    }
    #editor-container .ql-editor a {
      color: #C9A84C;
    }
    #editor-container .ql-editor blockquote {
      border-left: 3px solid #C9A84C;
      padding-left: 1rem;
      color: #B0B0B0;
    }
    .ql-toolbar.ql-snow {
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 4px 4px 0 0;
      background: #1A1A1A;
    }
    .ql-toolbar.ql-snow .ql-stroke {
      stroke: #B0B0B0;
    }
    .ql-toolbar.ql-snow .ql-fill {
      fill: #B0B0B0;
    }
    .ql-toolbar.ql-snow .ql-picker {
      color: #B0B0B0;
    }
    .ql-toolbar.ql-snow .ql-picker-options {
      background: #1A1A1A;
      color: #B0B0B0;
    }
    .ql-snow .ql-picker.ql-expanded .ql-picker-label {
      border-color: rgba(201,168,76,0.3);
    }
    .ql-snow .ql-picker.ql-expanded .ql-picker-options {
      border-color: rgba(201,168,76,0.3);
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 0.5rem 1rem;
      background: #141414;
      border: 1px solid rgba(201,168,76,0.15);
      color: #B0B0B0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }
    .pagination button:hover {
      border-color: #C9A84C;
      color: #C9A84C;
    }
    .pagination button.active {
      background: #C9A84C;
      color: #0A0A0A;
      border-color: #C9A84C;
    }
    .pagination button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .pagination button:disabled:hover {
      border-color: rgba(201,168,76,0.15);
      color: #B0B0B0;
    }

    @media (max-width: 768px) {
      .admin-form .form-row {
        grid-template-columns: 1fr;
      }
      .admin-table {
        display: block;
        overflow-x: auto;
      }
      .admin-header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div id="app">
<!-- Login Screen -->
<div id="loginScreen" class="admin-login">
  <h2>🔐 Admin Login</h2>
  <p style="color:#888; margin-bottom:1.5rem;">Sign in to manage blog posts</p>
  <div class="form-field">
    <input type="email" id="loginEmail" placeholder="Email address" />
  </div>
  <div class="form-field" style="position:relative;">
    <input type="password" id="loginPassword" placeholder="Password" />
    <button type="button" id="togglePassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#888; cursor:pointer; padding:8px;">
      <i class="fas fa-eye"></i>
    </button>
  </div>
  <button class="btn btn--gold" id="loginBtn">Sign In</button>
  <div id="loginError" class="error"></div>
</div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">
      <div class="admin-container">
        <div class="admin-header">
          <h1><i class="fas fa-edit" style="color:#C9A84C;"></i> Blog Admin</h1>
          <div>
            <span id="adminUser" style="color:#888; margin-right:1rem;"></span>
            <button class="btn btn--outline" id="logoutBtn">Logout</button>
          </div>
        </div>

        <div id="adminMessages"></div>

        <!-- Create/Edit Form -->
        <div class="admin-form" id="blogFormContainer">
          <h3 id="formTitle" style="color:#FFFFFF; margin-bottom:1rem;">Create New Post</h3>
          <form id="adminBlogForm">
            <input type="hidden" id="editPostId" />
            <div class="form-field">
              <label for="postTitle">Title *</label>
              <input type="text" id="postTitle" placeholder="Enter post title" required />
            </div>
            <div class="form-field">
              <label for="postSlug">Slug (URL) *</label>
              <input type="text" id="postSlug" placeholder="e.g. how-to-choose-the-right-security-system" required />
              <small style="color:#666; display:block; margin-top:0.3rem;">Use lowercase letters, numbers, and hyphens only</small>
            </div>
            <div class="form-field">
              <label for="postMetaDesc">Meta Description</label>
              <input type="text" id="postMetaDesc" placeholder="Brief summary for SEO (150-160 characters)" />
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="postImage">Featured Image URL</label>
                <input type="url" id="postImage" placeholder="https://i.postimg.cc/..." />
                <small style="color:#666; display:block; margin-top:0.3rem;">Upload to Postimages or another host, then paste the direct URL</small>
              </div>
              <div class="form-field">
                <label for="postAuthor">Author</label>
                <input type="text" id="postAuthor" placeholder="Imaan Fihlani" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="postCategories">Categories</label>
                <input type="text" id="postCategories" placeholder="e.g. Strategy, Branding, Social Media" />
                <small style="color:#666; display:block; margin-top:0.3rem;">Separate multiple categories with commas</small>
              </div>
              <div class="form-field">
                <label for="postTags">Tags</label>
                <input type="text" id="postTags" placeholder="e.g. marketing, growth, engagement" />
                <small style="color:#666; display:block; margin-top:0.3rem;">Separate multiple tags with commas</small>
              </div>
            </div>
            <div class="form-field">
              <label>Content *</label>
              <div id="editor-container"></div>
            </div>
            <div class="form-field checkbox-field">
              <input type="checkbox" id="postPublished" checked />
              <label for="postPublished">Publish immediately</label>
            </div>
            <div>
              <button type="submit" class="btn btn--gold" id="savePostBtn">Save Post</button>
              <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Posts List -->
        <div id="postsList">
          <div class="admin-toolbar">
            <button class="btn btn--gold" id="newPostBtn"><i class="fas fa-plus"></i> New Post</button>
            <button class="btn btn--outline" id="refreshPostsBtn"><i class="fas fa-sync"></i> Refresh</button>
            <span style="color:#666; font-size:0.85rem; margin-left:auto;" id="postCount"></span>
          </div>
          <div id="postsTableContainer">
            <div class="admin-loading">Loading posts...</div>
          </div>
          <div id="paginationContainer" class="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
